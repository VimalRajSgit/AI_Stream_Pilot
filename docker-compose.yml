services:
  # ─────────────────────────────────────────
  # Zookeeper (Kafka needs this)
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ─────────────────────────────────────────
  # Kafka Broker
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────
  # Producer (Wikimedia → Kafka)
  # ─────────────────────────────────────────
  producer:
    build: .
    container_name: producer
    command: python producer/producer.py
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  # ─────────────────────────────────────────
  # AI Processor (Kafka → DistilBERT → Kafka)
  # ─────────────────────────────────────────
  ai_processor:
    build: .
    command: python ai_processor.py
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    environment:
      - PYTHONUNBUFFERED=1

  # ─────────────────────────────────────────
  # Consumer (Kafka → Final Output)
  # ─────────────────────────────────────────
  consumer:
    build: .
    container_name: consumer
    command: python consumer/consumer.py
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
